{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}MH SHUVO{% endblock %}
    </title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/about.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    {% block css_extra %}{% endblock css_extra %}

</head>
<body>

    {% include 'partials/portfolio/common/navbar.html' %}

    <main id="content">

        {% block content %}
        {% endblock %}

    </main>

    {% include 'partials/portfolio/common/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function setActive(el) {

            // remove active from all links
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });

            // add active to clicked link
            el.classList.add('active');
        }

        function updateActiveNav() {
            const path = window.location.pathname;

            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');

                const href = link.getAttribute('hx-get');

                if (href === path) {
                    link.classList.add('active');
                }
            });
        }

        // run on page load
        document.addEventListener("DOMContentLoaded", updateActiveNav);

        // run after HTMX navigation
        document.body.addEventListener("htmx:afterSwap", updateActiveNav);
        {% block js_extra %}{% endblock js_extra %}
    </script>


</body>
</html>
