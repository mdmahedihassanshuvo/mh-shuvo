name: Apply backend frontend refactor

on:
  push:
    branches:
      - refactor/separate-backend-frontend
permissions:
  contents: write
  pull-requests: write
jobs:
  refactor:
    if: "github.event.head_commit.message != 'chore: apply backend frontend refactor'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend frontend
          git mv api backend/api
          git mv mh_shuvo backend/mh_shuvo
          git mv portfolio backend/portfolio
          git mv templates backend/templates
          git mv static backend/static
          git mv media backend/media
          git mv manage.py backend/manage.py
          git mv requirements.txt backend/requirements.txt
          git mv backend/portfolio/frontend/* frontend/
          git mv backend/portfolio/frontend/.gitignore frontend/.gitignore
          rmdir backend/portfolio/frontend
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backend/mh_shuvo/settings.py')
          s = p.read_text()
          s = s.replace('from pathlib import Path', 'import os\nfrom pathlib import Path\nfrom django.core.management.utils import get_random_secret_key')
          s = s.replace("SECRET_KEY = 'django-insecure-_6_%s05jqs-7)lxa3ws=3ugt47$ax3=2cofezbas3iyy1cg60x'", "DEBUG = os.getenv('DJANGO_DEBUG', 'True').lower() in {'1', 'true', 'yes'}\nSECRET_KEY = os.getenv('DJANGO_SECRET_KEY') or get_random_secret_key()")
          s = s.replace('DEBUG = True\n\nALLOWED_HOSTS = []', "ALLOWED_HOSTS = [x.strip() for x in os.getenv('DJANGO_ALLOWED_HOSTS', 'localhost,127.0.0.1').split(',') if x.strip()]")
          s = s.replace('EMAIL_HOST_USER = "hassanmdmahedi729@gmail.com"\nEMAIL_HOST_PASSWORD = "qzbs yvxf jwsh yisy"', "EMAIL_HOST_USER = os.getenv('EMAIL_HOST_USER', '')\nEMAIL_HOST_PASSWORD = os.getenv('EMAIL_HOST_PASSWORD', '')\nDEFAULT_FROM_EMAIL = os.getenv('DEFAULT_FROM_EMAIL', EMAIL_HOST_USER or 'webmaster@localhost')\nCONTACT_RECIPIENT_EMAIL = os.getenv('CONTACT_RECIPIENT_EMAIL', EMAIL_HOST_USER)")
          p.write_text(s)
          p = Path('backend/portfolio/views.py')
          s = p.read_text().replace('from django.core.mail import send_mail', 'from django.conf import settings\nfrom django.core.mail import send_mail')
          s = s.replace('from_email=email,', 'from_email=settings.DEFAULT_FROM_EMAIL,').replace('recipient_list=["hassanmdmahedi729@gmail.com"],', 'recipient_list=[settings.CONTACT_RECIPIENT_EMAIL],\n            reply_to=[email],')
          p.write_text(s)
          p = Path('frontend/vite.config.js')
          s = p.read_text().replace("path.resolve(__dirname, '../../static/portfolio')", "path.resolve(__dirname, '../backend/static/portfolio')").replace('port: 5000', 'port: 5173')
          p.write_text(s)
          p = Path('frontend/package.json')
          d = json.loads(p.read_text()); d['devDependencies']['@vitejs/plugin-react'] = '^6.1.2'; p.write_text(json.dumps(d, indent=2) + '\n')
          Path('.env.example').write_text('DJANGO_SECRET_KEY=replace-me\nDJANGO_DEBUG=True\nDJANGO_ALLOWED_HOSTS=localhost,127.0.0.1\nEMAIL_BACKEND=django.core.mail.backends.console.EmailBackend\nEMAIL_HOST_USER=\nEMAIL_HOST_PASSWORD=\nDEFAULT_FROM_EMAIL=\nCONTACT_RECIPIENT_EMAIL=\n')
          Path('README.md').write_text('# MH Shuvo Portfolio\n\nDjango backend and React/Vite frontend. See backend/ and frontend/.\n')
          PY
          cd frontend
          npm install --ignore-scripts
          npm run build
          cd ..
          rm -f .github/workflows/refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: apply backend frontend refactor'
          git push origin HEAD:refactor/separate-backend-frontend
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/$GITHUB_REPOSITORY/pulls -d '{"title":"Refactor: separate backend and frontend","head":"refactor/separate-backend-frontend","base":"main","body":"Separates Django backend and React/Vite frontend, preserves the portfolio, fixes configuration, and removes committed secrets."}' || true
